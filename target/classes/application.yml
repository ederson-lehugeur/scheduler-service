spring:
  application:
    name: scheduler-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:investalert}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:2}
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:5}
      idle-timeout: ${MYSQL_POOL_IDLE_TIMEOUT:30000}
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT:20000}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: ${QUARTZ_THREAD_COUNT:2}

app:
  scheduler:
    evaluation-interval-ms: ${SCHEDULER_INTERVAL_MS:300000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
